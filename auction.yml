on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Создать исходники плагина
        run: |
          set -e
          mkdir -p Auction/src/main/java/auction/economy Auction/src/main/resources
          cat > Auction/pom.xml << 'EOF_0'
